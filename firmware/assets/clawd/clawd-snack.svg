<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <style>
    .body { animation: chew 2s infinite; transform-origin: 7.5px 15px; }
    .mouth { animation: bite 2s infinite steps(1); transform-origin: 7.5px 11.5px; }
    .cookie { animation: snack 2s infinite; }
    .crumbs { animation: scatter 2s infinite; }
    @keyframes chew {
      0%, 36%, 54%, 77%, 100% { transform: scaleY(1); }
      46%, 66% { transform: scaleY(.9); }
    }
    @keyframes bite {
      0%, 25%, 77% { opacity: 0; }
      32%, 58% { opacity: 1; transform: scaleY(1); }
      44%, 69% { opacity: 1; transform: scaleY(.5); }
    }
    @keyframes snack {
      0% { transform: translate(-5px, 2px); opacity: 0; }
      12% { transform: translate(-3px, 1px); opacity: 1; }
      33%, 40% { transform: translate(0, 0); opacity: 1; }
      41%, 100% { opacity: 0; }
    }
    @keyframes scatter {
      0%, 39% { opacity: 0; transform: translate(0, 0); }
      42% { opacity: 1; transform: translate(0, 0); }
      62% { opacity: 1; transform: translate(-2px, -3px); }
      79%, 100% { opacity: 0; transform: translate(-4px, 2px); }
    }
  </style>
  <rect x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
  <g class="body" fill="#DE886D">
    <rect x="2" y="6" width="11" height="7"/>
    <rect x="0" y="9" width="2" height="2"/>
    <rect x="13" y="9" width="2" height="2"/>
    <path d="M3 13h1v2H3zm2 0h1v2H5zm4 0h1v2H9zm2 0h1v2h-1z"/>
    <path fill="#000" d="M4 8h1v2H4zm6 0h1v2h-1z"/>
    <rect class="mouth" x="6" y="10.5" width="3" height="2" fill="#542f26"/>
  </g>
  <g class="cookie">
    <path d="M5.5 8.5h3v1h1v3h-1v1h-3v-1h-1v-3h1z" fill="#F4BB64"/>
    <path d="M6 9.5h1v1H6zm1.5 2h1v1h-1zm-2 0h1v1h-1z" fill="#75452D"/>
  </g>
  <path class="crumbs" d="M6 8h1v1H6zm3-1h1v1H9zm3 2h1v1h-1z" fill="#F4BB64"/>
</svg>
